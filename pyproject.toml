[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reqcheck-se"
version = "0.1.0"
description = "Requirement quality and traceability checks for YAML, CSV and ReqIF files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pavan Kulkarni" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["requirements engineering", "systems engineering", "traceability", "ReqIF", "EARS", "INCOSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reqcheck = "reqcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
