name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q

  check-requirements:
    # Runs reqcheck on the example requirements, the way a project team
    # would run it on its own requirements on every commit.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Check ACC requirements (must pass, at least 80 % verified)
        run: reqcheck check examples/acc_requirements.yaml --html acc_report.html --min-verification-coverage 80
      - name: Check draft requirements (expected to fail, report only)
        run: reqcheck check examples/draft_lka_requirements.csv --html draft_report.html --fail-on never
      - uses: actions/upload-artifact@v4
        with:
          name: requirement-reports
          path: "*_report.html"
